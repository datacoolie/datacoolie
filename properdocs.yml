site_name: DataCoolie
site_description: Multi-engine, multi-platform Python data pipeline framework for SQL and Python dataflows — metadata-driven and batch-first.
site_url: https://datacoolie.github.io/datacoolie/
repo_url: https://github.com/datacoolie/datacoolie
repo_name: datacoolie/datacoolie
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

# Generated bytecode and runtime/build state are never public example source.
# Keep local test artefacts out of the static ``examples/files`` tree as well
# as out of generated projections and project archives.
exclude_docs: |
  scripts/**
  **/__pycache__/**
  **/*.py[cod]
  examples/files/**/__pycache__/**
  examples/files/**/*.py[cod]
  examples/files/**/.runtime/**
  examples/files/**/.builds/**
  examples/files/projects/**/data/output/**
  examples/files/projects/**/dist/**

# Generated source projections are linked from the authored example pages but
# are intentionally not expanded into the primary navigation.
not_in_nav: |
  examples/source/**
  guide/metadata/metadata-document.md
  guide/metadata/api-source-configuration.md
  guide/metadata/incremental-windows.md
  guide/metadata/identity-extensions-and-overlays.md
  guide/metadata/partitioning-and-sanitization.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: images/logos/datacoolie-icon-circle-dark_512x512.png
  favicon: images/logos/datacoolie-icon-circle-dark_32x32.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  analytics:
    provider: google
    property: G-LY6YXVV9WZ
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datacoolie/datacoolie
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/datacoolie/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@datacoolie

extra_css:
  - assets/stylesheets/zoomable-media.css
  - assets/stylesheets/example-code.css

extra_javascript:
  - assets/javascripts/mermaid-loader.js
  - assets/javascripts/zoomable-media.js
  - assets/javascripts/example-code.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: dc-mermaid-source
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - docs/scripts/inject_public_version.py
  - docs/scripts/gen_llms.py
  - docs/scripts/inject_examples_index.py
  - docs/scripts/seo_metadata.py
  - docs/scripts/copy_schema_files.py
  - docs/scripts/inject_faq_schema.py
  - docs/scripts/inject_video_schema.py
  - docs/scripts/enhance_sitemap.py

plugins:
  - search
  - redirects:
      redirect_maps:
        getting-started/index.md: guide/getting-started/index.md
        getting-started/installation.md: guide/getting-started/installation.md
        getting-started/quickstart-polars.md: guide/getting-started/quickstart-polars.md
        getting-started/quickstart-spark.md: guide/getting-started/quickstart-spark.md
        getting-started/use-your-own-data.md: guide/getting-started/use-your-own-data.md
        getting-started/first-dataflow.md: guide/getting-started/multi-stage-dataflow.md
        getting-started/ai-assisted-workflow.md: introduction/ai-skills.md
        how-to/index.md: guide/index.md
        how-to/configure-file-metadata.md: guide/providers/file.md
        how-to/configure-database-metadata.md: guide/providers/database.md
        how-to/configure-api-metadata.md: guide/providers/api.md
        how-to/deploy-to-fabric.md: guide/platforms/fabric.md
        how-to/deploy-to-databricks.md: guide/platforms/databricks.md
        how-to/deploy-to-aws-glue.md: guide/platforms/aws-glue.md
        how-to/expected-failure-scenarios.md: guide/operations/troubleshooting.md
        how-to/maintenance-vacuum-optimize.md: guide/operations/maintenance.md
        how-to/replay-and-backfill.md: guide/operations/replay-and-backfill.md
        how-to/run-a-stage.md: guide/operations/run-stage.md
        how-to/merge-and-scd2.md: guide/metadata/destination-and-load-patterns.md
        how-to/partitioning-and-sanitization.md: guide/metadata/partitioning-and-sanitization.md
        how-to/metadata-guide/index.md: guide/metadata/index.md
        how-to/metadata-guide/first-metadata-file.md: guide/metadata/first-metadata-file.md
        how-to/metadata-guide/source-patterns.md: guide/metadata/source-patterns.md
        how-to/metadata-guide/transform-patterns.md: guide/metadata/transform-patterns.md
        how-to/metadata-guide/destination-and-load-patterns.md: guide/metadata/destination-and-load-patterns.md
        how-to/metadata-guide/validation-checklist.md: guide/metadata/validation-checklist.md
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      categories_allowed:
        - Release
        - Tutorial
        - Architecture
        - Benchmark
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
  - gen-files:
      scripts:
        - docs/scripts/gen_plugin_table.py
        - docs/scripts/gen_metadata_schema.py
        - docs/scripts/gen_runtime_configuration.py
        - docs/scripts/gen_examples.py
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters:
              - "!^_"

