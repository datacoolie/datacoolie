[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "datacoolie"
version = "0.1.9"
description = "Metadata-driven ETL framework that unifies engines, stays cloud-agnostic, and is currently batch-first with a roadmap to micro-batch and streaming."
authors = [
    {name = "DataCoolie Team"},
    {name = "Do Bui Nguyen Hieu", email = "nguyenhieubis@gmail.com"},
]
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<4.0"
keywords = ["etl", "etl-framework", "data-engineering", "metadata-driven", "polars", "pyspark", "lakehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"

dependencies = [
    "python-dateutil>=2.9,<3.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/datacoolie/datacoolie"
Repository = "https://github.com/datacoolie/datacoolie"
Documentation = "https://datacoolie.github.io/datacoolie/"

[project.optional-dependencies]
# --- Engines ---
spark = ["pyspark>=3.5"]
polars = ["polars>=1.0"]
polars-sql = ["polars>=1.0", "sqlglot>=30,<31"]
polars-hash = ["polars-hash>=0.6"]

# --- Engine + table-format profiles ---
spark-delta = ["pyspark>=3.5", "delta-spark>=3.0"]
polars-delta = ["polars>=1.0", "deltalake>=0.15"]
polars-iceberg = ["polars>=1.0", "pyiceberg>=0.6"]

# --- Platform profiles ---
aws = ["boto3>=1.43.2"]
fabric-external = [
    "azure-identity>=1.17,<2.0",
    "azure-storage-file-datalake>=12.14,<13.0",
    "azure-keyvault-secrets>=4.8,<5.0",
]
databricks-external = ["databricks-sdk>=0.121,<0.122"]

# --- Source profiles ---
source-api = ["httpx>=0.24"]
source-excel-polars = ["polars>=1.0", "fastexcel>=0.9", "openpyxl>=3.1"]
source-db-polars = ["polars>=1.0", "connectorx>=0.4,<0.5"]
source-db-oracle-polars = ["polars>=1.0", "oracledb>=2.0,<5.0"]
source-db-mssql-odbc-polars = [
    "polars>=1.0",
    "sqlalchemy>=2.0,<3.0",
    "pyodbc>=5.0,<6.0",
]

# --- Metadata profiles ---
metadata-yaml = ["pyyaml>=6.0,<7.0"]
metadata-excel = ["openpyxl>=3.1"]
metadata-db = ["sqlalchemy>=2.0,<3.0"]

# --- Everything ---
all = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
    "polars>=1.0",
    "sqlglot>=30,<31",
    "polars-hash>=0.6",
    "deltalake>=0.15",
    "pyiceberg>=0.6",
    "boto3>=1.43.2",
    "databricks-sdk>=0.121,<0.122",
    "azure-identity>=1.17,<2.0",
    "azure-storage-file-datalake>=12.14,<13.0",
    "azure-keyvault-secrets>=4.8,<5.0",
    "httpx>=0.24",
    "fastexcel>=0.9",
    "openpyxl>=3.1",
    "connectorx>=0.4,<0.5",
    "oracledb>=2.0,<5.0",
    "sqlalchemy>=2.0,<3.0",
    "pyodbc>=5.0,<6.0",
    "pyyaml>=6.0,<7.0",
]

[project.entry-points."datacoolie.engines"]
spark = "datacoolie.engines.spark_engine:SparkEngine"
polars = "datacoolie.engines.polars_engine:PolarsEngine"

[project.entry-points."datacoolie.platforms"]
local = "datacoolie.platforms.local_platform:LocalPlatform"
fabric = "datacoolie.platforms.fabric_platform:FabricPlatform"
databricks = "datacoolie.platforms.databricks_platform:DatabricksPlatform"
aws = "datacoolie.platforms.aws_platform:AWSPlatform"

[project.entry-points."datacoolie.sources"]
delta = "datacoolie.sources.delta_reader:DeltaReader"
parquet = "datacoolie.sources.file_reader:FileReader"
csv = "datacoolie.sources.file_reader:FileReader"
json = "datacoolie.sources.file_reader:FileReader"
jsonl = "datacoolie.sources.file_reader:FileReader"
avro = "datacoolie.sources.file_reader:FileReader"
excel = "datacoolie.sources.file_reader:FileReader"
sql = "datacoolie.sources.database_reader:DatabaseReader"
iceberg = "datacoolie.sources.iceberg_reader:IcebergReader"
function = "datacoolie.sources.python_function_reader:PythonFunctionReader"
api = "datacoolie.sources.api_reader:APIReader"

[project.entry-points."datacoolie.destinations"]
delta = "datacoolie.destinations.delta_writer:DeltaWriter"
iceberg = "datacoolie.destinations.iceberg_writer:IcebergWriter"
parquet = "datacoolie.destinations.file_writer:FileWriter"
csv = "datacoolie.destinations.file_writer:FileWriter"
json = "datacoolie.destinations.file_writer:FileWriter"
jsonl = "datacoolie.destinations.file_writer:FileWriter"
avro = "datacoolie.destinations.file_writer:FileWriter"

[project.entry-points."datacoolie.transformers"]
column_value_transformer = "datacoolie.transformers.column_value_transformer:ColumnValueTransformer"
schema_converter = "datacoolie.transformers.schema_converter:SchemaConverter"
hash_column_adder = "datacoolie.transformers.hash_column_adder:HashColumnAdder"
deduplicator = "datacoolie.transformers.deduplicator:Deduplicator"
column_adder = "datacoolie.transformers.column_adder:ColumnAdder"
system_column_adder = "datacoolie.transformers.column_adder:SystemColumnAdder"
partition_handler = "datacoolie.transformers.partition_handler:PartitionHandler"
data_masker = "datacoolie.transformers.data_masker:DataMasker"
column_projector = "datacoolie.transformers.column_projector:ColumnProjector"
column_name_sanitizer = "datacoolie.transformers.column_name_sanitizer:ColumnNameSanitizer"
scd2_column_adder = "datacoolie.transformers.column_adder:SCD2ColumnAdder"
row_filter = "datacoolie.transformers.row_filter:RowFilter"

[project.entry-points."datacoolie.resolvers"]
env = "datacoolie.core.secret_resolver:EnvResolver"

[tool.poetry]
packages = [{include = "datacoolie", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
python-dateutil = ">=2.9,<3.0"
tzdata = {version = ">=2024.1", markers = "sys_platform == 'win32'"}
# Optional — activated via [project.optional-dependencies]
pyspark = {version = ">=3.5", optional = true}
delta-spark = {version = ">=3.0", optional = true}
polars = {version = ">=1.0", optional = true}
sqlglot = {version = ">=30,<31", optional = true}
polars-hash = {version = ">=0.6", optional = true}
deltalake = {version = ">=0.15", optional = true}
pyiceberg = {version = ">=0.6", optional = true}
boto3 = {version = ">=1.43.2", optional = true}
databricks-sdk = {version = ">=0.121,<0.122", optional = true}
azure-identity = {version = ">=1.17,<2.0", optional = true}
azure-storage-file-datalake = {version = ">=12.14,<13.0", optional = true}
azure-keyvault-secrets = {version = ">=4.8,<5.0", optional = true}
httpx = {version = ">=0.24", optional = true}
sqlalchemy = {version = "^2.0", optional = true}
connectorx = {version = ">=0.4,<0.5", optional = true}
oracledb = {version = ">=2.0,<5.0", optional = true}
fastexcel = {version = ">=0.9", optional = true}
openpyxl = {version = ">=3.1", optional = true}
pyodbc = {version = ">=5.0,<6.0", optional = true}
pyyaml = {version = ">=6.0,<7.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-mock = "^3.0"
pytest-xdist = "^3.0"
jsonschema = "^4.0"
pyarrow = ">=14.0"
xlsxwriter = ">=3.2"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
properdocs = "^1.6.7"
mkdocs-material = "^9.5"
mkdocstrings = {extras = ["python"], version = "^1.0.6"}
pymdown-extensions = "^10.9"
mkdocs-gen-files = "^0.5"
mkdocs-literate-nav = "^0.6"
mkdocs-section-index = "^0.3"
mkdocs-rss-plugin = ">=1.12"
ruff = "^0.15.22"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    "--import-mode=importlib",
    "-n",
    "auto",
    "--dist",
    "loadgroup",
    "-m",
    "not spark",
]
log_cli = false
log_level = "WARNING"
markers = [
    "unit: marks tests as unit tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "cloud_integration: marks opt-in tests that access real cloud resources",
    "benchmark: marks opt-in performance benchmark tests",
    "cloud_platform(name): identifies the cloud platform used by an integration test",
    "spark: marks tests requiring SparkSession",
    "xdist_group(name): serializes tests that share a process-level or JVM resource",
]


