# Preserve the former tests/docker-compose.yml project namespace after relocation.
name: tests
services:
  postgres:
    image: postgres:16-alpine
    container_name: skills-test-postgres
    ports:
    - 5442:5432
    environment:
      POSTGRES_DB: pagila
      POSTGRES_USER: datacoolie
      POSTGRES_PASSWORD: datacoolie
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./fixtures/postgres/pagila.sql:/docker-entrypoint-initdb.d/01-pagila.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U datacoolie -d pagila
      interval: 10s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8.4
    container_name: skills-test-mysql
    ports:
    - 3316:3306
    environment:
      MYSQL_DATABASE: sakila
      MYSQL_USER: datacoolie
      MYSQL_PASSWORD: datacoolie
      MYSQL_ROOT_PASSWORD: root
    volumes:
    - mysql_data:/var/lib/mysql
    - ./fixtures/mysql/sakila.sql:/docker-entrypoint-initdb.d/01-sakila.sql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      - -u
      - datacoolie
      - -pdatacoolie
      interval: 10s
      timeout: 5s
      retries: 10
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skills-test-mssql
    ports:
    - 1444:1433
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Testing@123
      MSSQL_PID: Developer
    volumes:
    - mssql_data:/var/opt/mssql
    - ./fixtures/mssql:/opt/mssql-scripts
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Testing@123' -No -Q 'SELECT
        1' > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: skills-test-minio
    ports:
    - 9010:9000
    - 9011:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 3
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: skills-test-iceberg
    ports:
    - 8182:8181
    environment:
      CATALOG_WAREHOUSE: s3://skills-test/iceberg-warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      CATALOG_S3_REGION: us-east-1
      AWS_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'echo > /dev/tcp/localhost/8181' 2>/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  trino:
    image: trinodb/trino:latest
    container_name: skills-test-trino
    ports:
    - 8090:8080
    volumes:
    - ./fixtures/iceberg/trino-catalog:/etc/trino/catalog
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8080/v1/info | grep -q '"starting":false'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
volumes:
  postgres_data: null
  mysql_data: null
  mssql_data: null
  minio_data: null
