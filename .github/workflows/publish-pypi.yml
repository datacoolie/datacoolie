name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/datacoolie/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify_release_ref.py --tag "$RELEASE_TAG"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Install release dependencies
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: true
        run: >-
          poetry sync --with dev --with docs
          -E polars-delta
          -E polars-hash
          -E polars-sql
          -E polars-iceberg
          -E source-api
          -E metadata-db
          -E aws
          -E source-excel-polars
          -E spark-delta
          -E cli

      - name: Install release validation tools
        run: poetry run python -m pip install --upgrade -r scripts/requirements-release.txt

      - name: Run release gate for tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python scripts/verify_release.py --tag "$RELEASE_TAG"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
