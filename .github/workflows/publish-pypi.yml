name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/datacoolie/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Install release dependencies
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: true
        run: >-
          poetry sync --with dev --with docs
          -E polars-delta
          -E polars-hash
          -E polars-sql
          -E polars-iceberg
          -E source-api
          -E metadata-db
          -E aws
          -E source-excel-polars
          -E spark-delta

      - name: Install release validation tools
        run: poetry run python -m pip install --upgrade twine

      - name: Run release gate for tag
        run: poetry run python scripts/verify_release.py --tag "${{ github.ref_name }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
