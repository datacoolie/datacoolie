name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The shadow receipt resolves the PR base/head and checked-out
          # merge-tree commits locally.  Shallow history cannot prove that
          # binding or include merge-result changes safely.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install dependencies
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: true
        run: >-
          poetry sync --with dev --with docs
          -E polars-delta
          -E polars-hash
          -E polars-sql
          -E polars-iceberg
          -E source-api
          -E metadata-db
          -E aws
          -E source-excel-polars
          -E spark-delta
          -E cli

      - name: Install release validation and build tools
        run: poetry run python -m pip install --upgrade -r scripts/requirements-release.txt

      - name: Test AI skill scripts
        run: poetry run python ai/skills/tests/run_all.py

      - name: Run local release gate (shadow selection)
        # Spark tests remain local-only. The shared verifier makes package,
        # docs, core non-Spark, and release-contract test failures blocking.
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          CI_SELECTION_RECEIPT: .ci-artifacts/selection-receipt.json
        run: poetry run python scripts/verify_ci.py

      - name: Upload CI selection receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-selection-receipt-${{ github.run_id }}
          path: .ci-artifacts/selection-receipt.json
          if-no-files-found: warn
