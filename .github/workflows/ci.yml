name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.4

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install dependencies
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: true
        run: >-
          poetry sync --with dev
          -E polars
          -E polars-hash
          -E deltalake
          -E iceberg
          -E api
          -E db
          -E boto3
          -E excel

      - name: Validate Poetry metadata
        run: poetry check --lock --strict

      - name: Build package
        run: poetry build

      - name: Required non-Spark tests
        # Spark tests are intentionally local-only because JVM startup makes
        # them too expensive for the GitHub-hosted validation job.
        run: poetry run pytest tests/ -m "not spark" --tb=short
